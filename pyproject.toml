[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Modelagem de risco de crédito com WoE, Logit, LightGBM e régua de rating"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.3,<2.4", "pandas>=2.2,<2.3", "scipy>=1.17,<1.18",
    "scikit-learn>=1.8,<1.9", "statsmodels>=0.15,<0.16", "optbinning>=1.0,<1.1",
    "lightgbm>=4.7,<4.8", "hyperopt>=0.3,<0.4", "shap>=0.54,<0.55",
    "matplotlib>=3.10,<3.11", "seaborn>=0.13,<0.14", "ipython>=9,<10",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=7,<8", "matplotlib-inline>=0.2,<0.3"]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "nbclient>=0.11,<0.12",
       "nbformat>=5,<6", "lxml>=6,<7", "ipykernel>=7,<8", "matplotlib-inline>=0.2,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
